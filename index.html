<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator | Zack</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #qrcode {
      margin: 20px auto;
    }
    #downloadBtn {
      margin-top: 10px;
      padding: 10px 20px;
      background: #0078d7;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #downloadBtn:hover {
      background: #005fa3;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
  </style>
</head>
<body>

  <h1>QR Code Generator</h1>
  
  <!-- Input for text or URL -->
  <input type="text" id="text" placeholder="Enter text or URL" />
  <button id="generateBtn">Generate QR Code</button>
  
  <!-- Container for QR code -->
  <div id="qrcode"></div>
  
  <!-- Download button -->
  <button id="downloadBtn">Download QR Code</button>

  <!-- Include QRCode.js library -->
  <script src="qrcode.min.js"></script>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const qrcodeContainer = document.getElementById("qrcode");

    generateBtn.addEventListener("click", () => {
      const text = document.getElementById("text").value;
      if (!text) return alert("Please enter text or URL!");

      // Clear previous QR code
      qrcodeContainer.innerHTML = "";

      // Generate new QR code
      new QRCode(qrcodeContainer, {
        text: text,
        width: 200,
        height: 200
      });
    });

    // Download button functionality
    document.getElementById("downloadBtn").addEventListener("click", function() {
      const qrImg = qrcodeContainer.querySelector("img") || qrcodeContainer.querySelector("canvas");
      if (!qrImg) return alert("Generate a QR code first!");

      const link = document.createElement("a");
      link.download = "qrcode.png";
      link.href = qrImg.tagName.toLowerCase() === "canvas" ? qrImg.toDataURL("image/png") : qrImg.src;
      link.click();
    });
  </script>

</body>
</html>
